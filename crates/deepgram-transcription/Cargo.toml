[package]
name = "deepgram-transcription"
version = "0.1.0"
edition = "2024"
description = "Cached audio transcription, spending history, and Markdown reports for Deepgram"
license = "MIT"
authors = ["Alex Gorbatchev"]
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
tokio-util = "0.7"

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
url = "2"

[lints.rust]
unsafe_code = "forbid"
