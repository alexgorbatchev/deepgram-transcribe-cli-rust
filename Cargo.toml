[package]
name = "deepgram-transcribe-cli"
version = "0.1.0"
edition = "2024"
description = "Cached Deepgram audio transcription and spending history"
license = "MIT"
authors = ["Alex Gorbatchev"]
publish = false

[[bin]]
name = "deepgram-transcribe"
path = "src/main.rs"

[dependencies]
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
deepgram-transcription = { path = "crates/deepgram-transcription" }
clap_complete = "4.6"
chrono = "0.4"
comfy-table = { version = "7.2", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
serde_json = "1"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[workspace]
members = [".","crates/deepgram-transcription"]
default-members = [".","crates/deepgram-transcription"]
resolver = "3"
